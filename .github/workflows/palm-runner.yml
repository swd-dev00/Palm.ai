name: Palm GitHub Actions runner

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Palm runner execution ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: palm-runner-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  validate_openapi:
    name: Validate Palm OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate OpenAPI 3.1 structure
        run: npx --yes @redocly/cli@2.47.0 lint palm-control-plane.openapi.yaml --extends=spec --format=github-actions

  execute:
    name: Execute Palm run ${{ inputs.run_id }}
    needs: validate_openapi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pinned runner client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Execute allowlisted Palm handlers
        env:
          PALM_BASE_URL: ${{ secrets.PALM_BASE_URL }}
          PALM_RUNNER_SHARED_SECRET: ${{ secrets.PALM_RUNNER_SHARED_SECRET }}
          PALM_RUN_ID: ${{ inputs.run_id }}
          PALM_INPUT_DIR: ${{ runner.temp }}/palm-input
          PALM_RUNNER_DIR: ${{ runner.temp }}/palm-output
        run: node ./palm-github-actions-runner.mjs
